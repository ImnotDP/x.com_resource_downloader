<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X GIF 下载器本地验证</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        background: #f2f4f5;
        color: #0f1419;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0 auto;
        max-width: 680px;
        padding: 28px 16px 56px;
      }

      h1 {
        font-size: 24px;
        margin: 0 0 8px;
      }

      .intro {
        color: #536471;
        margin: 0 0 20px;
      }

      article {
        background: #fff;
        border: 1px solid #cfd9de;
        border-radius: 16px;
        margin: 16px 0;
        overflow: hidden;
        padding: 16px;
      }

      article h2 {
        font-size: 15px;
        margin: 0 0 12px;
      }

      [data-testid="videoPlayer"] {
        background: linear-gradient(135deg, #1d9bf0, #7856ff);
        border-radius: 12px;
        min-height: 190px;
        overflow: hidden;
      }

      video {
        display: block;
        min-height: 190px;
        width: 100%;
      }

      #downloads {
        background: #e8f5fd;
        border-radius: 12px;
        color: #0f1419;
        min-height: 24px;
        padding: 12px;
      }
    </style>
    <script>
      globalThis.chrome = globalThis.chrome || {};
      globalThis.chrome.runtime = {
        lastError: null,
        sendMessage(message, callback) {
          const downloads = document.querySelector("#downloads");
          downloads.textContent = `${message.filename} → ${message.url}`;
          callback({ ok: true, downloadId: 1 });
        }
      };
    </script>
  </head>
  <body>
    <h1>X GIF 下载器本地验证</h1>
    <p class="intro">GIF 卡片应显示按钮，普通视频不应显示按钮。</p>

    <article>
      <a href="https://x.com/example/status/1234567890">示例推文</a>
      <h2>GIF 动图</h2>
      <div data-testid="videoPlayer">
        <video
          muted
          loop
          poster="https://pbs.twimg.com/tweet_video_thumb/example-gif.jpg"
        ></video>
      </div>
    </article>

    <article>
      <h2>普通视频</h2>
      <div data-testid="videoPlayer">
        <video
          muted
          poster="https://pbs.twimg.com/ext_tw_video_thumb/example-video.jpg"
        ></video>
      </div>
    </article>

    <article id="dynamic-container">
      <h2>动态加载区域</h2>
      <p>页面打开后会自动插入另一张 GIF 卡片。</p>
    </article>

    <h2>模拟下载结果</h2>
    <div id="downloads">尚未点击下载</div>

    <script src="../content.js"></script>
    <script>
      setTimeout(() => {
        document
          .querySelector("article .x-gif-download-button")
          ?.remove();
      }, 400);

      setTimeout(() => {
        document.querySelector("#dynamic-container").insertAdjacentHTML(
          "beforeend",
          `
            <div data-testid="videoPlayer">
              <video
                muted
                loop
                poster="https://pbs.twimg.com/tweet_video_thumb/dynamic-gif.png"
              ></video>
            </div>
          `
        );
      }, 250);
    </script>
  </body>
</html>
